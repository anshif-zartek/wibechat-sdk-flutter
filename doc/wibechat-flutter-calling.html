<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wibechat Flutter Calling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet step list on the left, one step at a time on the right. Single accent = the app's primary blue. */
:root {
  --bg: #FFFFFF; --side: #F8F9FB; --fg: #16203A; --muted: #6A7389; --faint: #A3AABB; --line: #E8EBF1;
  --accent: #4255D4; --accent-soft: #EEF0FF; --done: #1C8C5E;
  --code-bg: #F7F8FA; --code-fg: #1F2A44; --gut: #B4BAC8;
  --hl-kw: #6A3FC8; --hl-str: #17803F; --hl-num: #B05A00; --hl-fn: #2E47C2; --hl-type: #A02C72; --hl-com: #8C94A6;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1320; --side: #121828; --fg: #E6EAF3; --muted: #939CB2; --faint: #5E677D; --line: #222A3D;
  --accent: #8E9CFF; --accent-soft: #1C2340; --done: #4CC891;
  --code-bg: #131A2B; --code-fg: #D8DEEC; --gut: #465069;
  --hl-kw: #B9A6FF; --hl-str: #8ED6A3; --hl-num: #F2B66F; --hl-fn: #8DB4FF; --hl-type: #F09AC4; --hl-com: #6C778F;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1320; --side: #121828; --fg: #E6EAF3; --muted: #939CB2; --faint: #5E677D; --line: #222A3D;
  --accent: #8E9CFF; --accent-soft: #1C2340; --done: #4CC891;
  --code-bg: #131A2B; --code-fg: #D8DEEC; --gut: #465069;
  --hl-kw: #B9A6FF; --hl-str: #8ED6A3; --hl-num: #F2B66F; --hl-fn: #8DB4FF; --hl-type: #F09AC4; --hl-com: #6C778F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font: .88em var(--mono); background: var(--accent-soft); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }

/* Sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 12px 28px; }
.brand { padding: 0 10px 18px; }
.brand b { font-weight: 600; font-size: 15px; display: block; }
.brand span { font-size: 13px; color: var(--muted); }
.prog { height: 3px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
.side h2 { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 18px 10px 8px; }
.side ol { list-style: none; margin: 0; padding: 0; }
.item { width: 100%; text-align: left; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 10px; border-radius: 7px; font-size: 14px; line-height: 1.35; color: var(--muted); }
.item:hover { color: var(--fg); }
.item[aria-current="true"] { background: var(--bg); color: var(--fg); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.ring { width: 16px; height: 16px; display: block; }
.ring circle { fill: none; stroke-width: 2; }
.ring .bgc { stroke: var(--line); }
.ring .fgc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .35s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.item.done .ring .bgc { stroke: var(--done); fill: var(--done); }
.item.done .ring .fgc { stroke: none; }
.ring path { fill: none; stroke: var(--bg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; display: none; }
.item.done .ring path { display: block; }
.item .soon { font-size: 11px; color: var(--faint); margin-left: 4px; }

/* Mobile picker */
.picker { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .picker { display: flex; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
  .picker select { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--side); color: var(--fg); }
  .picker .pct { font: 12px var(--mono); color: var(--muted); }
}

/* Reader */
main { min-width: 0; padding-inline: 48px; padding-block: 44px 64px; }
@media (max-width: 860px) { main { padding-inline: 16px; padding-block: 24px 48px; } }
article { max-width: 760px; margin: 0 auto; }
article.enter { animation: in .22s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(4px); } }
.eyebrow { font: 12px var(--mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.eyebrow .st-done { color: var(--done); }
.eyebrow .st-plan { color: var(--hl-num); }
h1 { font-size: clamp(1.6rem, 3.2vw, 2rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin: 8px 0 12px; text-wrap: balance; }
.why { color: var(--muted); margin: 0; max-width: 68ch; }
.needs { font-size: 14px; color: var(--muted); margin-top: 10px; }
.needs button { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
h3 { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 36px 0 12px; }

.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.checks label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 8px 10px; margin-inline: -10px; border-radius: 8px; cursor: pointer; align-items: start; }
.checks label:hover { background: var(--side); }
.checks input { appearance: none; width: 18px; height: 18px; margin: 3px 0 0; border: 1.5px solid var(--faint); border-radius: 5px; display: grid; place-items: center; transition: background .15s, border-color .15s; cursor: pointer; }
.checks input::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; rotate: -45deg; translate: 0 -1px; scale: 0; transition: scale .15s; }
.checks input:checked { background: var(--done); border-color: var(--done); }
.checks input:checked::after { scale: 1; }
.checks input:checked + span { color: var(--muted); }

/* Code */
.code { border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; min-width: 0; }
.cbar { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 6px 0 4px; overflow-x: auto; scrollbar-width: none; }
.ctab { font: 12.5px var(--mono); color: var(--muted); padding: 10px 10px 9px; border-bottom: 2px solid transparent; white-space: nowrap; }
.ctab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.cbar .sp { flex: 1; }
.copy { font: 12px var(--mono); color: var(--muted); padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.copy:hover { color: var(--fg); background: var(--bg); }
.path { font: 12px var(--mono); color: var(--faint); padding: 10px 14px 0; overflow-wrap: anywhere; }
.scroll { overflow: auto; max-height: 440px; padding: 8px 0 14px; }
.lines { display: grid; grid-template-columns: auto 1fr; font: 13px/1.65 var(--mono); min-width: max-content; color: var(--code-fg); }
.gut { text-align: right; padding: 0 14px; color: var(--gut); user-select: none; white-space: pre; font-variant-numeric: tabular-nums; }
.lines pre { margin: 0; padding-right: 20px; white-space: pre; }
.lines pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); }
.hljs-string { color: var(--hl-str); }
.hljs-number, .hljs-symbol { color: var(--hl-num); }
.hljs-title, .hljs-section { color: var(--hl-fn); }
.hljs-type, .hljs-title.class_, .hljs-name, .hljs-tag { color: var(--hl-type); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-meta { color: var(--hl-num); }
.nocode { color: var(--muted); font-size: 14.5px; margin: 0; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 10px; }

.test { margin: 0; padding-left: 14px; border-left: 2px solid var(--done); max-width: 68ch; }

.foot { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.nav { text-align: left; font-size: 14px; color: var(--muted); display: grid; gap: 2px; min-width: 0; }
.nav small { font: 11px var(--mono); color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
.nav span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav:hover span { color: var(--accent); }
.nav.next { text-align: right; }
.complete { font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 8px; background: var(--accent); color: #fff; white-space: nowrap; }
.complete.is-done { background: none; color: var(--done); box-shadow: inset 0 0 0 1px var(--done); }
@media (max-width: 560px) { .foot { grid-template-columns: 1fr 1fr; } .complete { grid-column: 1 / -1; grid-row: 1; } }
.keys { margin-top: 18px; font: 12px var(--mono); color: var(--faint); text-align: center; }
.keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
@media (max-width: 860px) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { article.enter { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Steps">
    <div class="brand"><b>Wibechat Flutter Calling</b><span id="pct">0 of 0 steps complete</span><div class="prog"><i id="bar"></i></div></div>
    <h2>Core flow</h2><ol id="list-core"></ol>
    <h2>Add-ons</h2><ol id="list-addons"></ol>
  </aside>
  <main>
    <div class="picker"><select id="pick" aria-label="Jump to step"></select><span class="pct" id="pct-m"></span></div>
    <article id="view"></article>
  </main>
</div>

<script>
const DATA = {"core":[{"id":"setup","title":"Add packages and platform permissions","platforms":["Flutter","Android","iOS"],"summary":"Install the calling stack and declare the mic, camera, push and background permissions each OS needs.","why":"Everything later depends on these. Android blocks the mic and camera without manifest permissions. iOS crashes on the first camera access if the usage strings are missing, and it never delivers VoIP-style pushes without the background modes.","steps":["Add the dependencies below to \u003ccode>pubspec.yaml\u003c/code>, then run \u003ccode>flutter pub get\u003c/code>. The SDK is \u003ccode>wibechat_client\u003c/code>; import it as \u003ccode>wc\u003c/code> (see the Import tab). It needs Dart 3.10 / Flutter 3.38 or newer.","In \u003ccode>AndroidManifest.xml\u003c/code>, add the permissions for internet, audio, Bluetooth, camera, notifications and foreground service.","In \u003ccode>ios/Runner/Info.plist\u003c/code>, add \u003ccode>NSMicrophoneUsageDescription\u003c/code>, \u003ccode>NSCameraUsageDescription\u003c/code> and the \u003ccode>audio\u003c/code>, \u003ccode>remote-notification\u003c/code> and \u003ccode>voip\u003c/code> background modes.","In Xcode, open Runner → Signing &amp; Capabilities and add \u003cb>Push Notifications\u003c/b> and \u003cb>Background Modes\u003c/b>.","Run \u003ccode>flutterfire configure\u003c/code>. It writes \u003ccode>lib/firebase_options.dart\u003c/code>, \u003ccode>google-services.json\u003c/code> and \u003ccode>GoogleService-Info.plist\u003c/code>."],"snippets":[{"file":"pubspec.yaml","lang":"yaml","label":"Dependencies","start":37,"end":48,"code":"firebase_core: ^4.15.0\nfirebase_auth: ^6.7.0\ncloud_firestore: ^6.10.0\nwibechat_client: ^2.13.1\nhttp: ^1.6.0\npermission_handler: ^13.0.2\nfirebase_messaging: ^16.7.0\nflutter_local_notifications: ^22.3.1\nflutter_callkit_incoming: ^3.1.6\nuuid: ^4.6.0\nflutter_background: ^1.3.1\ngoogle_sign_in: ^6.2.1"},{"file":null,"lang":"yaml","label":"Before it is on pub.dev","code":"# Use the Git source until wibechat_client is published to pub.dev\nwibechat_client:\n  git:\n    url: https://github.com/anshif-zartek/wibechat-sdk-flutter.git"},{"file":null,"lang":"dart","label":"Import","code":"import 'package:wibechat_client/wibechat_client.dart' as wc;"},{"file":"android/app/src/main/AndroidManifest.xml","lang":"xml","label":"Android permissions","start":2,"end":9,"code":"\u003cuses-permission android:name=\"android.permission.INTERNET\" />\n\u003cuses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\u003cuses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n\u003cuses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />\n\u003cuses-permission android:name=\"android.permission.CAMERA\" />\n\u003cuses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n\u003cuses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n\u003cuses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION\" />"},{"file":"ios/Runner/Info.plist","lang":"xml","label":"iOS usage + background modes","start":29,"end":38,"code":"\u003ckey>NSMicrophoneUsageDescription\u003c/key>\n\u003cstring>Wibechat uses your microphone for calls.\u003c/string>\n\u003ckey>NSCameraUsageDescription\u003c/key>\n\u003cstring>Wibechat uses your camera for video calls.\u003c/string>\n\u003ckey>UIBackgroundModes\u003c/key>\n\u003carray>\n\t\u003cstring>audio\u003c/string>\n\t\u003cstring>remote-notification\u003c/string>\n\t\u003cstring>voip\u003c/string>\n\u003c/array>"}],"verify":"\u003ccode>flutter run\u003c/code> builds on both an Android device and an iPhone with no missing-plugin errors."},{"id":"firebase","title":"Start Firebase, the SDK and notifications in main()","platforms":["Flutter","Firebase"],"summary":"Initialize Firebase and the Wibechat SDK, wire up the notification service, and replay any notification or call that launched the app.","why":"The notification service must register its background handler before runApp. A cold start from a tapped notification or an accepted call can only navigate after the first frame, once \u003ccode>navigatorKey\u003c/code> is attached.","steps":["Call \u003ccode>Firebase.initializeApp\u003c/code>, then \u003ccode>WibeChatClient.initialize()\u003c/code> (optional, but it lets you set \u003ccode>bypassVoiceProcessing\u003c/code> or audio-session options before the first call), and then \u003ccode>NotificationService.instance.initialize()\u003c/code> before \u003ccode>runApp\u003c/code>.","Give \u003ccode>MaterialApp\u003c/code> the global \u003ccode>navigatorKey\u003c/code> so services can push the call screen without a \u003ccode>BuildContext\u003c/code>.","In a post-frame callback, call \u003ccode>handleInitialMessage()\u003c/code> and \u003ccode>handleInitialCall()\u003c/code>.","Every repository reads the named Firestore database \u003ccode>wibechatapp\u003c/code>, not \u003ccode>(default)\u003c/code>. Keep that id in one constants file."],"snippets":[{"file":"lib/main.dart","lang":"dart","start":10,"end":46,"code":"void main() async {\n  WidgetsFlutterBinding.ensureInitialized();\n  await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);\n  await wc.WibeChatClient.initialize();\n  await NotificationService.instance.initialize();\n  runApp(const MyApp());\n}\n\nclass MyApp extends StatefulWidget {\n  const MyApp({super.key});\n\n  @override\n  State\u003cMyApp> createState() => _MyAppState();\n}\n\nclass _MyAppState extends State\u003cMyApp> {\n  @override\n  void initState() {\n    super.initState();\n    // Deferred until the first frame so `navigatorKey` is attached before a\n    // cold start triggered by tapping a notification tries to push a route.\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      NotificationService.instance.handleInitialMessage();\n      NotificationService.instance.handleInitialCall();\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n      navigatorKey: navigatorKey,\n      theme: appTheme,\n      debugShowCheckedModeBanner: false,\n      home: const AuthGate(),\n    );\n  }\n}"},{"file":"lib/App/navigation/app_navigator.dart","lang":"dart","start":1,"end":5,"code":"import 'package:flutter/material.dart';\n\n/// App-wide navigator key so code outside the widget tree (notification\n/// tap handlers, background isolates) can push routes without a [BuildContext].\nfinal GlobalKey\u003cNavigatorState> navigatorKey = GlobalKey\u003cNavigatorState>();"},{"file":"lib/core/constants/firestore_constants.dart","lang":"dart","start":1,"end":12,"code":"class FirestoreConstants {\n  FirestoreConstants._();\n\n  /// Named Firestore database (not the \"(default)\" one) provisioned for this app.\n  static const databaseId = 'wibechatapp';\n\n  static const usersCollection = 'users';\n  static const roomsCollection = 'rooms';\n\n  /// Subcollection of [usersCollection] — each user's own call history.\n  static const callLogsSubcollection = 'callLogs';\n}"}],"verify":"The app launches to the login screen and the console shows no Firebase initialization errors."},{"id":"auth","title":"Sign users in and register their device","platforms":["Flutter","Firebase"],"summary":"Email/password auth, a users/{uid} profile, and the FCM token that lets other people ring this device.","why":"A call is placed to a user id. The push function looks up that user's \u003ccode>fcmToken\u003c/code> in Firestore, so every sign-in must store a fresh token, and token rotation must update it.","steps":["On sign-up, create the auth account, set the display name, and write \u003ccode>users/{uid}\u003c/code>.","After every sign-in or sign-up, request notification permission and save \u003ccode>getToken()\u003c/code> to the user doc with \u003ccode>merge: true\u003c/code>.","Listen to \u003ccode>onTokenRefresh\u003c/code> in the repository constructor, so a rotated token replaces the stored one.","Route with \u003ccode>AuthGate\u003c/code>, a \u003ccode>StreamBuilder\u003c/code> on \u003ccode>authStateChanges\u003c/code> that shows Home or Login."],"snippets":[{"file":"lib/features/Auth/data/auth_repository.dart","lang":"dart","label":"signUp","start":38,"end":65,"code":"Future\u003cUser> signUp({\n  required String email,\n  required String password,\n  String? displayName,\n}) async {\n  final credential = await _auth.createUserWithEmailAndPassword(\n    email: email.trim(),\n    password: password,\n  );\n  final user = credential.user!;\n\n  if (displayName != null && displayName.trim().isNotEmpty) {\n    await user.updateDisplayName(displayName.trim());\n  }\n\n  await _firestore\n      .collection(FirestoreConstants.usersCollection)\n      .doc(user.uid)\n      .set({\n        'uid': user.uid,\n        'email': user.email,\n        'displayName': displayName?.trim() ?? '',\n        'createdAt': FieldValue.serverTimestamp(),\n      });\n\n  await _registerFcmToken(user.uid);\n  return user;\n}"},{"file":"lib/features/Auth/data/auth_repository.dart","lang":"dart","label":"FCM token","start":131,"end":149,"code":"Future\u003cvoid> _registerFcmToken(String uid) async {\n  try {\n    await FirebaseMessaging.instance.requestPermission();\n    final token = await FirebaseMessaging.instance.getToken();\n    if (token != null) await _saveFcmToken(uid, token);\n  } catch (_) {\n    // Ignore — e.g. permission denied, or no token available yet.\n  }\n}\n\nFuture\u003cvoid> _saveFcmToken(String uid, String token) {\n  return _firestore\n      .collection(FirestoreConstants.usersCollection)\n      .doc(uid)\n      .set({\n        'fcmToken': token,\n        'fcmTokenUpdatedAt': FieldValue.serverTimestamp(),\n      }, SetOptions(merge: true));\n}"},{"file":"lib/features/Auth/presentation/auth_gate.dart","lang":"dart","label":"AuthGate","start":10,"end":25,"code":"class AuthGate extends StatelessWidget {\n  const AuthGate({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return StreamBuilder\u003cUser?>(\n      stream: authRepository.authStateChanges,\n      builder: (context, snapshot) {\n        if (snapshot.connectionState == ConnectionState.waiting) {\n          return const Scaffold(body: Center(child: CircularProgressIndicator()));\n        }\n        return snapshot.data != null ? const HomeScreen() : const LoginScreen();\n      },\n    );\n  }\n}"}],"verify":"After signing in, the Firestore console shows \u003ccode>users/{uid}\u003c/code> with an \u003ccode>fcmToken\u003c/code> field."},{"id":"token-fn","title":"Deploy the Wibechat token function","platforms":["Backend"],"summary":"A Cloud Function that verifies the Firebase ID token, checks the room, and signs a one-hour Wibechat call token (JWT).","why":"The Wibechat server API secret must never ship in the app. The function takes identity from the verified Firebase token, never from the request, so nobody can join as someone else.","steps":["Copy \u003ccode>functions/.env.example\u003c/code> to \u003ccode>functions/.env\u003c/code> and fill in the Wibechat server key, secret and server URL (the variable names keep the LIVEKIT_ prefix because the token library reads them). Never commit \u003ccode>.env\u003c/code>.","The \u003ccode>requireAuth\u003c/code> middleware rejects any request without a valid \u003ccode>Authorization: Bearer &lt;idToken&gt;\u003c/code>.","\u003ccode>userCanJoin\u003c/code> requires the room doc to exist and not be \u003ccode>open: false\u003c/code>.","The grant allows join, publish and subscribe for that one room. The response is \u003ccode>{ serverUrl, token }\u003c/code>.","Deploy with \u003ccode>firebase deploy --only functions:wibechatToken\u003c/code>."],"snippets":[{"file":"functions/src/index.ts","lang":"typescript","label":"wibechatToken","start":33,"end":95,"code":"async function requireAuth(req: Request, res: Response, next: NextFunction) {\n  const header = req.headers.authorization ?? \"\";\n  const idToken = header.startsWith(\"Bearer \") ? header.slice(7) : undefined;\n  if (!idToken) {\n    res.status(401).json({ error: \"missing bearer token\" });\n    return;\n  }\n  try {\n    req.user = await getAuth().verifyIdToken(idToken);\n    next();\n  } catch {\n    res.status(401).json({ error: \"invalid or expired token\" });\n  }\n}\n\nasync function userCanJoin(room: string): Promise\u003cboolean> {\n  const roomDoc = await db.collection(\"rooms\").doc(room).get();\n  if (!roomDoc.exists) return false;\n  // Rooms created through the app are open by default — any signed-in user\n  // may join. `open: false` is reserved for future invite-only rooms.\n  return roomDoc.get(\"open\") !== false;\n}\n\nconst app = express();\n\napp.get(\"/api/wibechat-token\", requireAuth, async (req, res) => {\n  // identity comes from your verified session — never from the request\n  const identity = req.user!.uid;\n  const room = String(req.query.room ?? \"\").trim();\n\n  if (!room) {\n    res.status(400).json({ error: '\"room\" query parameter is required' });\n    return;\n  }\n\n  // and check this user is actually allowed in this room\n  if (!(await userCanJoin(room))) {\n    res.status(403).json({ error: \"not a member of this room\" });\n    return;\n  }\n\n  const at = new AccessToken(requireEnv(\"LIVEKIT_API_KEY\"), requireEnv(\"LIVEKIT_API_SECRET\"), {\n    identity,\n    // Shown as the participant's label in the call UI — the uid on its own\n    // means nothing to another user, so prefer their email.\n    name: req.user!.email ?? identity,\n    ttl: \"1h\",\n  });\n\n  at.addGrant({\n    roomJoin: true,\n    room,\n    canPublish: true, // microphone and camera\n    canSubscribe: true,\n  });\n\n  res.json({\n    serverUrl: requireEnv(\"LIVEKIT_SERVER_URL\"),\n    token: await at.toJwt(),\n  });\n});\n\nexport const wibechatToken = onRequest(app);"},{"file":null,"label":"functions/.env","lang":"ini","code":"LIVEKIT_API_KEY=\nLIVEKIT_API_SECRET=\nLIVEKIT_SERVER_URL=wss://call.wibechat.com"},{"file":null,"label":"Deploy","lang":"bash","code":"cd functions && npm install\nfirebase deploy --only functions:wibechatToken"}],"verify":"Calling the endpoint with no bearer token returns \u003ccode>401\u003c/code>. With a valid one and an existing room, it returns JSON with \u003ccode>token\u003c/code>."},{"id":"api","title":"Fetch a call token from Flutter","platforms":["Flutter"],"summary":"A shared ApiService attaches the ID token. LiveKitTokenService calls the function for a room.","why":"Each backend call goes through one client, so auth headers, JSON decoding and error messages work the same everywhere.","steps":["\u003ccode>ApiService._headers\u003c/code> adds \u003ccode>Authorization: Bearer\u003c/code> with \u003ccode>currentUser.getIdToken()\u003c/code>.","Any response outside 2xx becomes an \u003ccode>ApiException\u003c/code> carrying the server's \u003ccode>error\u003c/code> message.","\u003ccode>LiveKitTokenService.fetchToken(room)\u003c/code> returns the server URL and JWT used to connect."],"snippets":[{"file":"lib/core/network/api_service.dart","lang":"dart","label":"ApiService","start":53,"end":75,"code":"Future\u003cMap\u003cString, String>> _headers({required bool auth}) async {\n  final headers = {'Content-Type': 'application/json'};\n  if (!auth) return headers;\n\n  final idToken = await authRepository.currentUser?.getIdToken();\n  if (idToken == null) {\n    throw StateError('Must be signed in to call the API.');\n  }\n  headers['Authorization'] = 'Bearer $idToken';\n  return headers;\n}\n\nMap\u003cString, dynamic> _decode(http.Response response) {\n  final body = response.body.isEmpty\n      ? \u003cString, dynamic>{}\n      : jsonDecode(response.body) as Map\u003cString, dynamic>;\n\n  if (response.statusCode \u003c 200 || response.statusCode >= 300) {\n    final message = body['error'] as String? ?? 'Request failed (${response.statusCode})';\n    throw ApiException(response.statusCode, message);\n  }\n  return body;\n}"},{"file":"lib/features/Room/data/livekit_token_service.dart","lang":"dart","label":"LiveKitTokenService","start":3,"end":23,"code":"class LiveKitToken {\n  LiveKitToken({required this.serverUrl, required this.token});\n\n  final String serverUrl;\n  final String token;\n}\n\n/// Calls the `wibechatToken` Cloud Function to mint a Wibechat access token\n/// for the signed-in user. The function verifies the Firebase ID token and\n/// checks room membership server-side — see functions/src/index.ts.\nclass LiveKitTokenService {\n  static const _tokenEndpoint =\n      'https://us-central1-wibechat-demo-2026.cloudfunctions.net/wibechatToken/api/wibechat-token';\n\n  Future\u003cLiveKitToken> fetchToken(String room) async {\n    final body = await apiService.get(_tokenEndpoint, queryParameters: {'room': room});\n    return LiveKitToken(serverUrl: body['serverUrl'] as String, token: body['token'] as String);\n  }\n}\n\nfinal LiveKitTokenService liveKitTokenService = LiveKitTokenService();"}],"verify":"Calling \u003ccode>liveKitTokenService.fetchToken('test')\u003c/code> for an existing room returns a token beginning with \u003ccode>eyJ\u003c/code>."},{"id":"rooms","title":"Give every pair of users one room id","platforms":["Flutter","Firebase"],"summary":"Both people compute the same dm-\u003cuidA>-\u003cuidB> id, and the first caller creates the room doc.","why":"Neither side needs a lookup to find the shared room. Sorting the uids means caller and callee always get the same id. Only the first caller writes the doc, which matches the rule that only \u003ccode>createdBy\u003c/code> may update it.","steps":["\u003ccode>directRoomId\u003c/code> sorts the two uids and joins them as \u003ccode>dm-a-b\u003c/code>.","\u003ccode>getOrCreateDirectRoom\u003c/code> reads the doc and creates it only if it is missing, with \u003ccode>open: true\u003c/code> and \u003ccode>direct: true\u003c/code>.","\u003ccode>otherUidInDirectRoom\u003c/code> recovers the other person from the id. It returns null for group rooms."],"snippets":[{"file":"lib/features/Room/data/room_repository.dart","lang":"dart","label":"directRoomId","start":65,"end":92,"code":"String directRoomId(String uidA, String uidB) {\n  final sorted = [uidA, uidB]..sort();\n  return 'dm-${sorted[0]}-${sorted[1]}';\n}\n\n/// Returns the direct-room id for [currentUser] and [otherUid], creating\n/// the room first if it doesn't exist yet. Only the first caller creates\n/// it — the second just joins — since the security rules only let the\n/// `createdBy` user update an existing room doc.\nFuture\u003cString> getOrCreateDirectRoom({\n  required User currentUser,\n  required String otherUid,\n  String? otherLabel,\n}) async {\n  final roomId = directRoomId(currentUser.uid, otherUid);\n  final doc = await _rooms.doc(roomId).get();\n  if (!doc.exists) {\n    await _rooms.doc(roomId).set({\n      'name': otherLabel ?? roomId,\n      'open': true,\n      'direct': true,\n      'createdBy': currentUser.uid,\n      'createdByEmail': currentUser.email,\n      'createdAt': FieldValue.serverTimestamp(),\n    });\n  }\n  return roomId;\n}"},{"file":"lib/features/Room/data/room_repository.dart","lang":"dart","label":"otherUidInDirectRoom","start":97,"end":102,"code":"String? otherUidInDirectRoom(String roomId, String currentUid) {\n  if (!roomId.startsWith('dm-')) return null;\n  final uids = roomId.substring(3).split('-');\n  if (uids.length != 2 || !uids.contains(currentUid)) return null;\n  return uids.first == currentUid ? uids.last : uids.first;\n}"}],"verify":"A call from A to B and a call from B to A both open \u003ccode>rooms/dm-…\u003c/code> with the same id."},{"id":"place-call","title":"Place an outgoing call","platforms":["Flutter"],"summary":"startCall() creates the room, rings the other user with a data push, and opens the call screen.","why":"One function places calls everywhere (users list, call log), so ringing and navigation can't drift apart. The push is fire-and-forget, so a slow push never delays the caller's screen.","steps":["Get or create the direct room.","Send a push with \u003ccode>type: call\u003c/code> or \u003ccode>video_call\u003c/code> plus \u003ccode>roomId\u003c/code>, \u003ccode>title\u003c/code> (caller name) and \u003ccode>callerId\u003c/code>.","Push \u003ccode>CallScreen(isOutgoing: true)\u003c/code>. It shows \"Calling…\" until the other person joins.","Wire the Voice call and Video call buttons to \u003ccode>startCall\u003c/code>."],"snippets":[{"file":"lib/common/functions/call_actions.dart","lang":"dart","label":"startCall","start":14,"end":64,"code":"Future\u003cvoid> startCall(\n  BuildContext context, {\n  required String otherUid,\n  required String label,\n  required bool video,\n}) async {\n  final currentUser = authRepository.currentUser;\n  if (currentUser == null) return;\n\n  try {\n    final roomId = await roomRepository.getOrCreateDirectRoom(\n      currentUser: currentUser,\n      otherUid: otherUid,\n      otherLabel: label,\n    );\n\n    final callerLabel = currentUser.displayName?.trim().isNotEmpty == true\n        ? currentUser.displayName!\n        : (currentUser.email ?? 'Someone');\n    unawaited(\n      pushNotificationApi.send(\n        userId: otherUid,\n        title: video ? 'Incoming video call' : 'Incoming call',\n        desc: '$callerLabel is calling you',\n        data: {\n          'type': video ? NotificationType.videoCall : NotificationType.call,\n          'roomId': roomId,\n          'title': callerLabel,\n          'callerId': currentUser.uid,\n        },\n      ),\n    );\n\n    if (!context.mounted) return;\n    Navigator.of(context).push(\n      MaterialPageRoute(\n        builder: (_) => CallScreen(\n          roomId: roomId,\n          title: label,\n          startWithVideo: video,\n          isOutgoing: true,\n        ),\n      ),\n    );\n  } catch (e) {\n    if (!context.mounted) return;\n    ScaffoldMessenger.of(\n      context,\n    ).showSnackBar(SnackBar(content: Text('Could not start call: $e')));\n  }\n}"},{"file":"lib/features/User/presentation/users_screen.dart","lang":"dart","label":"Call buttons","start":124,"end":143,"code":"FilledButton.tonalIcon(\n  onPressed: () => startCall(\n    context,\n    otherUid: uid,\n    label: label,\n    video: false,\n  ),\n  icon: const Icon(Icons.call_outlined, size: 18),\n  label: const Text('Voice call'),\n),\nFilledButton.tonalIcon(\n  onPressed: () => startCall(\n    context,\n    otherUid: uid,\n    label: label,\n    video: true,\n  ),\n  icon: const Icon(Icons.videocam_outlined, size: 18),\n  label: const Text('Video call'),\n),"}],"verify":"Tapping Video call shows the \"Calling…\" screen with a pulsing avatar, and a \u003ccode>rooms/dm-…\u003c/code> doc appears."},{"id":"join","title":"Join the Wibechat room","platforms":["Flutter"],"summary":"Fetch a token, warm and open the connection, ask for permissions, then publish mic and camera.","why":"Connecting before asking for permissions means a user who denies them still joins listen-only, so the call doesn't fail. \u003ccode>prepareConnection\u003c/code> warms DNS and TLS to make the handshake faster.","steps":["Create the \u003ccode>Room\u003c/code> with \u003ccode>adaptiveStream\u003c/code> and \u003ccode>dynacast\u003c/code> on, to save bandwidth on small tiles.","In \u003ccode>_join\u003c/code>: fetch the token, run \u003ccode>prepareConnection\u003c/code>, then \u003ccode>connect\u003c/code>. Check \u003ccode>_left\u003c/code> after each await in case the user hung up meanwhile.","Request microphone and camera together. If they are denied, keep both off and show a listen-only banner.","Publish with \u003ccode>setMicrophoneEnabled\u003c/code> and \u003ccode>setCameraEnabled\u003c/code>. Audio calls start with the camera off.","Add \u003ccode>room.addListener\u003c/code> so any participant or track change rebuilds the grid."],"snippets":[{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Room","start":67,"end":70,"code":"final _room = wc.Room(\n  roomOptions: const wc.RoomOptions(adaptiveStream: true, dynacast: true),\n);\nlate final _listener = _room.createListener();"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"_join()","start":189,"end":253,"code":"Future\u003cvoid> _join() async {\n  if (_joinInProgress || _left) return;\n  _joinInProgress = true;\n  if (mounted) {\n    setState(() {\n      _connecting = true;\n      _reconnecting = false;\n      _error = null;\n    });\n  }\n\n  try {\n    final creds = await liveKitTokenService.fetchToken(widget.roomId);\n    if (_left) return;\n\n    // speeds up the handshake by warming the connection first\n    await _room.prepareConnection(creds.serverUrl, creds.token);\n    if (_left) return;\n    await _room.connect(creds.serverUrl, creds.token);\n    if (_left) {\n      await _room.disconnect();\n      return;\n    }\n\n    final user = authRepository.currentUser;\n    if (user != null) {\n      await roomRepository.joinPresence(roomId: widget.roomId, user: user);\n    }\n\n    if (!_permissionsChecked) {\n      _mediaGranted = await requestMediaPermissions();\n      _permissionsChecked = true;\n      if (!_mediaGranted) {\n        _microphoneEnabled = false;\n        _cameraEnabled = false;\n      }\n    }\n    if (_mediaGranted) {\n      await _room.localParticipant?.setMicrophoneEnabled(_microphoneEnabled);\n      await _room.localParticipant?.setCameraEnabled(_cameraEnabled);\n    }\n\n    _timer ??= Timer.periodic(const Duration(seconds: 1), (_) {\n      if (mounted) setState(() => _elapsed += const Duration(seconds: 1));\n    });\n\n    if (mounted) {\n      setState(() {\n        _connecting = false;\n        _reconnecting = false;\n        _error = null;\n      });\n    }\n  } catch (e) {\n    if (mounted && !_left) {\n      setState(() {\n        _connecting = false;\n        _reconnecting = false;\n        _error = e.toString();\n      });\n    }\n  } finally {\n    _joinInProgress = false;\n  }\n}"},{"file":"lib/common/functions/media_permissions.dart","lang":"dart","label":"Permissions","start":3,"end":9,"code":"Future\u003cbool> requestMediaPermissions() async {\n  final statuses = await [\n    Permission.microphone,\n    Permission.camera,\n  ].request();\n  return statuses.values.every((s) => s.isGranted);\n}"}],"verify":"Two signed-in devices on the same room each see the other's video, and the call timer starts."},{"id":"controls","title":"Add mute, camera, flip and end-call controls","platforms":["Flutter"],"summary":"Toggle published tracks on the local participant and render them as a control bar.","why":"Muting unpublishes the track at the source, so the other side sees the mic-off badge right away. Flip reads the current capture options, so it always switches to the opposite camera.","steps":["Mic and camera toggles call \u003ccode>setMicrophoneEnabled\u003c/code> and \u003ccode>setCameraEnabled\u003c/code> on the local participant.","Flip finds the local video track and calls \u003ccode>setCameraPosition(position.switched())\u003c/code>.","Show Flip only while the camera is on.","Use the same \u003ccode>_leave\u003c/code> for the End call button and the system back gesture (\u003ccode>PopScope(canPop: false)\u003c/code>)."],"snippets":[{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Toggles","start":255,"end":277,"code":"Future\u003cvoid> _toggleMic() async {\n  final next = !_microphoneEnabled;\n  await _room.localParticipant?.setMicrophoneEnabled(next);\n  if (mounted) setState(() => _microphoneEnabled = next);\n}\n\nFuture\u003cvoid> _toggleCamera() async {\n  final next = !_cameraEnabled;\n  await _room.localParticipant?.setCameraEnabled(next);\n  if (mounted) setState(() => _cameraEnabled = next);\n}\n\nFuture\u003cvoid> _flipCamera() async {\n  final videoPubs =\n      _room.localParticipant?.videoTrackPublications ?? const [];\n  if (videoPubs.isEmpty) return;\n  final track = videoPubs.first.track;\n  if (track == null) return;\n  final options = track.currentOptions;\n  if (options is wc.CameraCaptureOptions) {\n    await track.setCameraPosition(options.cameraPosition.switched());\n  }\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Control bar","start":904,"end":964,"code":"Widget _buildControlBar() {\n  final micOn = _microphoneEnabled;\n  final camOn = _cameraEnabled;\n  return Container(\n    width: double.infinity,\n    margin: const EdgeInsets.fromLTRB(12, 8, 12, 12),\n    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 18),\n    decoration: BoxDecoration(\n      color: AppColors.callSurface,\n      borderRadius: BorderRadius.circular(28),\n      border: Border.all(color: Colors.white.withValues(alpha: 0.06)),\n    ),\n    child: Wrap(\n      alignment: WrapAlignment.center,\n      spacing: 16,\n      runSpacing: 16,\n      children: [\n        _ControlButton(\n          label: micOn ? 'Mute' : 'Unmute',\n          icon: micOn ? Icons.mic_outlined : Icons.mic_off_outlined,\n          background: micOn ? Colors.white12 : Colors.white,\n          iconColor: micOn ? Colors.white : AppColors.callBackground,\n          onPressed: _toggleMic,\n        ),\n        _ControlButton(\n          label: camOn ? 'Video off' : 'Video on',\n          icon: camOn ? Icons.videocam_outlined : Icons.videocam_off_outlined,\n          background: camOn ? Colors.white12 : Colors.white,\n          iconColor: camOn ? Colors.white : AppColors.callBackground,\n          onPressed: _toggleCamera,\n        ),\n        if (camOn)\n          _ControlButton(\n            label: 'Flip',\n            icon: Icons.cameraswitch_outlined,\n            background: Colors.white12,\n            iconColor: Colors.white,\n            onPressed: _flipCamera,\n          ),\n        _ControlButton(\n          label: _screenShareEnabled ? 'Stop sharing' : 'Share',\n          icon: _screenShareEnabled\n              ? Icons.stop_screen_share_outlined\n              : Icons.screen_share_outlined,\n          background: _screenShareEnabled\n              ? AppColors.primary\n              : Colors.white12,\n          iconColor: Colors.white,\n          onPressed: _toggleScreenShare,\n        ),\n        _ControlButton(\n          label: 'End call',\n          icon: Icons.call_end_rounded,\n          background: AppColors.error,\n          iconColor: Colors.white,\n          onPressed: _leave,\n        ),\n      ],\n    ),\n  );\n}"}],"verify":"Muting shows a mic-off badge on your tile for the other person. Flip switches between front and back cameras."},{"id":"layout","title":"Lay out video for 1:1 and group calls","platforms":["Flutter"],"summary":"In a 1:1 call, the other person fills the screen with a draggable self-view. Three or more people get an even grid.","why":"This matches the layout people know from WhatsApp and FaceTime. The grid sizes its tiles to fill the space exactly, so nothing has to scroll.","steps":["Build a \u003ccode>_Tile\u003c/code> per participant. Prefer the screen-share track over the camera, and use null when the track is muted.","With exactly one remote participant, use \u003ccode>_PipVideoView\u003c/code>: remote full-screen and a 110×150 local tile that swaps on tap and drags within bounds.","With more people, pick the column count from the participant count and set \u003ccode>childAspectRatio\u003c/code> from the space available.","Render with \u003ccode>VideoTrackRenderer\u003c/code>: \u003ccode>cover\u003c/code> for cameras, \u003ccode>contain\u003c/code> for screen shares so edges aren't cropped.","Show a 3px border on whoever is speaking (\u003ccode>isSpeaking\u003c/code>)."],"snippets":[{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Grid","start":840,"end":902,"code":"Widget _buildVideoGrid() {\n  final localTile = _room.localParticipant != null\n      ? _localTile(_room.localParticipant!)\n      : null;\n  final remoteTiles = _room.remoteParticipants.values\n      .map(_remoteTile)\n      .toList();\n\n  // A plain 1:1 call gets a WhatsApp-style layout instead of an even\n  // grid: the other person full-screen, your own camera as a small\n  // draggable/tappable-to-swap overlay. Anyone else joining (via \"Add to\n  // call\") grows the tile count past 2 and falls back to the grid below.\n  if (localTile != null && remoteTiles.length == 1) {\n    return _PipVideoView(local: localTile, remote: remoteTiles.first);\n  }\n\n  final tiles = \u003c_Tile>[?localTile, ...remoteTiles];\n\n  if (tiles.isEmpty) {\n    return const Center(\n      child: CircularProgressIndicator(color: Colors.white),\n    );\n  }\n\n  if (tiles.length == 1) {\n    return Padding(\n      padding: const EdgeInsets.all(8),\n      child: _ParticipantTile(tile: tiles.first),\n    );\n  }\n\n  return LayoutBuilder(\n    builder: (context, constraints) {\n      final count = tiles.length;\n      // 2-4 participants always lay out as 2 rows (1 col for 2, 2 cols for 3-4).\n      final crossAxisCount = count \u003c= 4\n          ? ((count + 1) ~/ 2)\n          : (count \u003c= 9 ? 3 : 4);\n      final rows = (count / crossAxisCount).ceil();\n      const spacing = 8.0;\n      final tileWidth =\n          (constraints.maxWidth - (crossAxisCount + 1) * spacing) /\n          crossAxisCount;\n      final tileHeight =\n          (constraints.maxHeight - (rows + 1) * spacing) / rows;\n      final aspectRatio = (tileWidth > 0 && tileHeight > 0)\n          ? tileWidth / tileHeight\n          : 1.0;\n\n      return GridView.builder(\n        padding: const EdgeInsets.all(spacing),\n        gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(\n          crossAxisCount: crossAxisCount,\n          mainAxisSpacing: spacing,\n          crossAxisSpacing: spacing,\n          childAspectRatio: aspectRatio,\n        ),\n        itemCount: count,\n        itemBuilder: (context, index) => _ParticipantTile(tile: tiles[index]),\n      );\n    },\n  );\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Self-view","start":1057,"end":1125,"code":"class _PipVideoViewState extends State\u003c_PipVideoView> {\n  static const _pipWidth = 110.0;\n  static const _pipHeight = 150.0;\n  static const _margin = 12.0;\n\n  bool _mainIsLocal = false;\n  Offset? _pipOffset;\n\n  void _swap() => setState(() => _mainIsLocal = !_mainIsLocal);\n\n  @override\n  Widget build(BuildContext context) {\n    final main = _mainIsLocal ? widget.local : widget.remote;\n    final pip = _mainIsLocal ? widget.remote : widget.local;\n\n    return LayoutBuilder(\n      builder: (context, constraints) {\n        final maxLeft = (constraints.maxWidth - _pipWidth - _margin).clamp(\n          _margin,\n          double.infinity,\n        );\n        final maxTop = (constraints.maxHeight - _pipHeight - _margin).clamp(\n          _margin,\n          double.infinity,\n        );\n        // Bottom-left by default, like the platforms this mirrors.\n        final offset = _pipOffset ?? Offset(_margin, maxTop);\n        final left = offset.dx.clamp(_margin, maxLeft);\n        final top = offset.dy.clamp(_margin, maxTop);\n\n        return Stack(\n          children: [\n            Positioned.fill(child: _ParticipantTile(tile: main)),\n            Positioned(\n              left: left,\n              top: top,\n              child: GestureDetector(\n                onTap: _swap,\n                onPanUpdate: (details) {\n                  setState(() {\n                    _pipOffset = Offset(\n                      (left + details.delta.dx).clamp(_margin, maxLeft),\n                      (top + details.delta.dy).clamp(_margin, maxTop),\n                    );\n                  });\n                },\n                child: Container(\n                  width: _pipWidth,\n                  height: _pipHeight,\n                  decoration: BoxDecoration(\n                    borderRadius: BorderRadius.circular(12),\n                    boxShadow: const [\n                      BoxShadow(\n                        color: Colors.black54,\n                        blurRadius: 8,\n                        offset: Offset(0, 2),\n                      ),\n                    ],\n                  ),\n                  child: _ParticipantTile(tile: pip),\n                ),\n              ),\n            ),\n          ],\n        );\n      },\n    );\n  }\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Renderer","start":1146,"end":1154,"code":"if (tile.videoTrack != null)\n  wc.VideoTrackRenderer(\n    tile.videoTrack!,\n    // A shared screen needs to stay uncropped — cover would slice\n    // off its edges the way it happily does for a camera feed.\n    fit: tile.isScreenShare\n        ? wc.VideoViewFit.contain\n        : wc.VideoViewFit.cover,\n  )"}],"verify":"In a 1:1 call you can drag your self-view and tap it to swap. When a third person joins, the view switches to a grid."},{"id":"push-fn","title":"Deploy the push notification function","platforms":["Backend"],"summary":"sendNotification looks up the target's FCM token and sends a data-only, high-priority message for calls.","why":"Call invites must be \u003cb>data-only\u003c/b>. If the message has a \u003ccode>notification\u003c/code> block, the OS shows it by itself while the app is in the background, and the background isolate that shows the CallKit screen never runs.","steps":["Use \u003ccode>requireAuth\u003c/code> again, so only signed-in users can ring people.","Convert every \u003ccode>data\u003c/code> value to a string, because FCM rejects anything else.","For \u003ccode>call\u003c/code> and \u003ccode>video_call\u003c/code>, leave out \u003ccode>notification\u003c/code>, and set Android \u003ccode>priority: high\u003c/code> and APNs \u003ccode>content-available: 1\u003c/code>.","When FCM reports an unregistered token, delete \u003ccode>fcmToken\u003c/code> and return \u003ccode>410\u003c/code>.","On the client, \u003ccode>PushNotificationApi.send\u003c/code> catches every error, so ringing never blocks the caller.","Deploy with \u003ccode>firebase deploy --only functions:sendNotification\u003c/code>."],"snippets":[{"file":"functions/src/index.ts","lang":"typescript","label":"sendNotification","start":115,"end":186,"code":"notificationApp.post(\"/api/send-notification\", requireAuth, async (req, res) => {\n  const body = (req.body ?? {}) as SendNotificationBody;\n  const userId = String(body.user_id ?? body.userId ?? \"\").trim();\n  const title = String(body.title ?? \"\").trim();\n  const message = String(body.desc ?? body.body ?? \"\").trim();\n  const data = body.data ?? {};\n\n  if (!userId) {\n    res.status(400).json({ error: '\"user_id\" is required' });\n    return;\n  }\n  if (!title && !message) {\n    res.status(400).json({ error: '\"title\" or \"desc\" is required' });\n    return;\n  }\n\n  const userDoc = await db.collection(\"users\").doc(userId).get();\n  if (!userDoc.exists) {\n    res.status(404).json({ error: \"user not found\" });\n    return;\n  }\n\n  const token = userDoc.get(\"fcmToken\") as string | undefined;\n  if (!token) {\n    res.status(404).json({ error: \"user has no registered device\" });\n    return;\n  }\n\n  // FCM data-payload values must all be strings.\n  const stringData: Record\u003cstring, string> = {};\n  for (const [key, value] of Object.entries(data)) {\n    stringData[key] = typeof value === \"string\" ? value : JSON.stringify(value);\n  }\n\n  // Call invites must be data-only: a message that carries a top-level\n  // `notification` block gets auto-displayed by the OS whenever the app is\n  // backgrounded/terminated, and the client's background isolate (which is\n  // what shows the CallKit UI) is never invoked. Everything else keeps the\n  // notification block so it's visible without the app doing anything.\n  const isCallInvite = stringData.type === \"call\" || stringData.type === \"video_call\";\n\n  try {\n    await getMessaging().send({\n      token,\n      data: stringData,\n      ...(isCallInvite ? {} : { notification: { title, body: message } }),\n      android: {\n        priority: \"high\",\n        ...(isCallInvite ? {} : { notification: { channelId: \"high_importance_channel\" } }),\n      },\n      apns: {\n        headers: { \"apns-priority\": \"10\" },\n        payload: { aps: isCallInvite ? { \"content-available\": 1 } : { sound: \"default\" } },\n      },\n    });\n    res.json({ ok: true });\n  } catch (err) {\n    const code = (err as { code?: string }).code;\n    if (\n      code === \"messaging/registration-token-not-registered\" ||\n      code === \"messaging/invalid-registration-token\"\n    ) {\n      // Stale token — drop it so we stop trying to send to it.\n      await db.collection(\"users\").doc(userId).update({ fcmToken: FieldValue.delete() });\n      res.status(410).json({ error: \"device token no longer valid\" });\n      return;\n    }\n    res.status(500).json({ error: \"failed to send notification\" });\n  }\n});\n\nexport const sendNotification = onRequest(notificationApp);"},{"file":"lib/features/Notifications/data/push_notification_api.dart","lang":"dart","label":"Client","start":6,"end":31,"code":"class PushNotificationApi {\n  static const _endpoint =\n      'https://us-central1-wibechat-demo-2026.cloudfunctions.net/sendNotification/api/send-notification';\n\n  /// Best-effort: a failure here should never block the caller's own flow\n  /// (e.g. starting a call), so it's swallowed rather than thrown.\n  Future\u003cvoid> send({\n    required String userId,\n    required String title,\n    required String desc,\n    Map\u003cString, dynamic>? data,\n  }) async {\n    try {\n      await apiService.post(_endpoint, body: {\n        'user_id': userId,\n        'title': title,\n        'desc': desc,\n        'data': data ?? {},\n      });\n    } catch (_) {\n      // Notification delivery is best-effort.\n    }\n  }\n}\n\nfinal PushNotificationApi pushNotificationApi = PushNotificationApi();"}],"verify":"With the receiving app killed, starting a call still makes the other phone ring."},{"id":"incoming","title":"Show incoming calls on the native call screen","platforms":["Flutter","Android","iOS"],"summary":"Route call pushes to flutter_callkit_incoming in every app state, foreground, background and killed.","why":"A full-screen native ring is what makes this feel like a phone call rather than a chat notification. Background messages arrive in a separate isolate, so the handler must be a top-level function that starts Firebase again.","steps":["Register \u003ccode>firebaseMessagingBackgroundHandler\u003c/code> as a top-level function marked \u003ccode>@pragma('vm:entry-point')\u003c/code>.","Turn off iOS's own foreground banner (\u003ccode>alert: false\u003c/code>), because the app shows its own UI.","\u003ccode>_dispatch\u003c/code> on \u003ccode>data.type\u003c/code>: call or video_call shows CallKit, end_call dismisses it, and anything else shows a local notification.","Give each ring a fresh UUID and store \u003ccode>extra\u003c/code> in \u003ccode>_pendingCalls\u003c/code>. A timeout event only carries the id.","Ask for notification and full-screen-intent permission, so Android 14+ can show the ring over the lock screen."],"snippets":[{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"Background handler","start":38,"end":42,"code":"@pragma('vm:entry-point')\nFuture\u003cvoid> firebaseMessagingBackgroundHandler(RemoteMessage message) async {\n  await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);\n  await NotificationService.instance._dispatch(message);\n}"},{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"initialize","start":69,"end":87,"code":"Future\u003cvoid> initialize() async {\n  FirebaseMessaging.onBackgroundMessage(firebaseMessagingBackgroundHandler);\n\n  await _ensurePluginInitialized();\n\n  // We show notifications ourselves (local notification or CallKit) in\n  // every app state, so suppress iOS's own foreground presentation to\n  // avoid a duplicate banner.\n  await FirebaseMessaging.instance\n      .setForegroundNotificationPresentationOptions(\n        alert: false,\n        badge: true,\n        sound: false,\n      );\n\n  FirebaseMessaging.onMessage.listen(_dispatch);\n  FirebaseMessaging.onMessageOpenedApp.listen(_handleMessageTap);\n  FlutterCallkitIncoming.onEvent.listen(_onCallKitEvent);\n}"},{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"_dispatch","start":162,"end":180,"code":"Future\u003cvoid> _dispatch(RemoteMessage message) async {\n  switch (message.data['type']) {\n    case NotificationType.call:\n    case NotificationType.videoCall:\n      await _showIncomingCall(message);\n      break;\n    case NotificationType.endCall:\n      await FlutterCallkitIncoming.endAllCalls();\n      final roomId = message.data['roomId'] as String?;\n      if (roomId != null && roomId.isNotEmpty)\n        _callEndedController.add(roomId);\n      break;\n    default:\n      // A `notification` payload is already auto-displayed by the OS\n      // while the app isn't foregrounded — only data-only messages need\n      // a manual show here, otherwise the user sees it twice.\n      if (message.notification == null) await _showLocalNotification(message);\n  }\n}"},{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"CallKit ring","start":182,"end":229,"code":"Future\u003cvoid> _showIncomingCall(RemoteMessage message) async {\n  final data = message.data;\n  final roomId = data['roomId'] as String?;\n  if (roomId == null || roomId.isEmpty) return;\n\n  final isVideo = data['type'] == NotificationType.videoCall;\n  final callerName =\n      (data['title'] as String?) ?? message.notification?.title ?? 'Unknown';\n\n  final id = _uuid.v4();\n  final extra = \u003cString, dynamic>{\n    'roomId': roomId,\n    'type': data['type'],\n    'title': callerName,\n    'callerId': data['callerId'],\n  };\n  _pendingCalls[id] = extra;\n\n  await FlutterCallkitIncoming.showCallkitIncoming(\n    CallKitParams(\n      id: id,\n      nameCaller: callerName,\n      appName: 'Wibechat',\n      handle: callerName,\n      type: isVideo ? 1 : 0,\n      duration: 30000,\n      // Carried through to the CallEvent too, but [_pendingCalls] is the\n      // source of truth since a timeout event only carries the id.\n      extra: extra,\n      android: const AndroidParams(\n        isCustomNotification: true,\n        ringtonePath: 'system_ringtone_default',\n        backgroundColor: '#3F51B5',\n        actionColor: '#4CAF50',\n        incomingCallNotificationChannelName: 'Incoming Call',\n        missedCallNotificationChannelName: 'Missed Call',\n        textAccept: 'Accept',\n        textDecline: 'Decline',\n      ),\n      ios: const IOSParams(\n        iconName: 'CallKitLogo',\n        handleType: 'generic',\n        supportsVideo: true,\n        ringtonePath: 'system_ringtone_default',\n      ),\n    ),\n  );\n}"}],"verify":"Lock the receiving phone and call it. It shows the full-screen incoming call UI with Accept and Decline."},{"id":"answer","title":"Handle accept, decline and missed calls","platforms":["Flutter"],"summary":"Turn CallKit actions into navigation, a reply push to the caller, and call-log entries. Also recover a call answered while the app was killed.","why":"When the app is killed, CallKit's accept fires before Dart is running, so that event is lost. \u003ccode>handleInitialCall()\u003c/code> reads CallKit's \u003ccode>activeCalls()\u003c/code> after launch and opens the accepted call.","steps":["Accept opens \u003ccode>CallScreen\u003c/code> with the \u003ccode>callKitId\u003c/code> so the native call state can be cleared later.","Decline or timeout sends \u003ccode>end_call\u003c/code> to the caller (so their \"Calling…\" screen closes) and logs Declined or Missed for the callee.","On cold start, find the accepted call in \u003ccode>activeCalls()\u003c/code> and open it."],"snippets":[{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"_onCallKitEvent","start":231,"end":252,"code":"void _onCallKitEvent(CallEvent? event) {\n  switch (event) {\n    case CallEventActionCallAccept(:final callKitParams):\n      _openRoom(\n        _takePending(callKitParams.id) ?? callKitParams.extra ?? {},\n        callKitId: callKitParams.id,\n      );\n    case CallEventActionCallDecline(:final callKitParams):\n      final extra =\n          _takePending(callKitParams.id) ?? callKitParams.extra ?? {};\n      _notifyCallerCallEnded(extra, desc: 'Call declined');\n      _logIncomingCallNotAnswered(extra, status: CallLogStatus.declined);\n    case CallEventActionCallTimeout(:final id):\n      final extra = _takePending(id) ?? {};\n      _notifyCallerCallEnded(extra, desc: 'Missed call');\n      _logIncomingCallNotAnswered(extra, status: CallLogStatus.missed);\n    case CallEventActionCallEnded(:final callKitParams):\n      _takePending(callKitParams.id);\n    default:\n      break;\n  }\n}"},{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"Cold-start accept","start":100,"end":111,"code":"Future\u003cvoid> handleInitialCall() async {\n  final calls = await FlutterCallkitIncoming.activeCalls();\n  for (final call in calls) {\n    if (call.isAccepted) {\n      _openRoom(\n        Map\u003cString, dynamic>.from(call.extra ?? {}),\n        callKitId: call.id,\n      );\n      return;\n    }\n  }\n}"},{"file":"lib/features/Notifications/data/notification_service.dart","lang":"dart","label":"_openRoom","start":334,"end":351,"code":"void _openRoom(Map\u003cString, dynamic> fields, {String? callKitId}) {\n  final roomId = fields['roomId'] as String?;\n  if (roomId == null || roomId.isEmpty) return;\n\n  final state = navigatorKey.currentState;\n  if (state == null) return;\n\n  state.push(\n    MaterialPageRoute(\n      builder: (_) => CallScreen(\n        roomId: roomId,\n        title: fields['title'] as String?,\n        startWithVideo: fields['type'] == NotificationType.videoCall,\n        callKitId: callKitId,\n      ),\n    ),\n  );\n}"}],"verify":"Kill the app, accept the incoming call, and the call screen opens connected. Declining closes the caller's screen."},{"id":"hangup","title":"End the call on both sides","platforms":["Flutter"],"summary":"Disconnect, clear CallKit and presence, and tell the other party, whether or not they ever joined.","why":"If the other person never joined the room (still ringing, or they declined), no participant-disconnected event fires. The \u003ccode>end_call\u003c/code> push covers that case, and the SDK's participant event covers people already in the call.","steps":["\u003ccode>_leave\u003c/code> runs once (\u003ccode>_left\u003c/code> guard). It stops the timer, writes the call log, disconnects, calls \u003ccode>FlutterCallkitIncoming.endCall\u003c/code>, and removes presence.","For direct rooms, send \u003ccode>end_call\u003c/code> to the other user.","Listen to \u003ccode>onCallEndedRemotely\u003c/code>. When it fires for this room, call \u003ccode>_leave\u003c/code>.","In 1:1 calls, also leave when the last remote participant disconnects, but not during a reconnect.","Repeat the cleanup in \u003ccode>dispose\u003c/code> in case the screen is removed without \u003ccode>_leave\u003c/code>."],"snippets":[{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"_leave","start":530,"end":549,"code":"Future\u003cvoid> _leave() async {\n  if (_left) return;\n  _left = true;\n  _timer?.cancel();\n  _writeCallLog();\n  if (_screenShareEnabled && wc.lkPlatformIs(wc.PlatformType.android)) {\n    unawaited(FlutterBackground.disableBackgroundExecution());\n  }\n\n  final uid = authRepository.currentUser?.uid;\n  await _room.disconnect();\n  if (widget.callKitId != null) {\n    await FlutterCallkitIncoming.endCall(widget.callKitId!);\n  }\n  if (uid != null) {\n    await roomRepository.leavePresence(roomId: widget.roomId, uid: uid);\n    _notifyOtherPartyCallEnded(uid);\n  }\n  if (mounted) Navigator.of(context).pop();\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Remote left","start":110,"end":120,"code":"_listener.on\u003cwc.ParticipantDisconnectedEvent>((_) {\n  // A full SDK reconnect temporarily rebuilds participant state.\n  // Do not interpret that as the other person hanging up.\n  if (_reconnecting || _connecting) return;\n  final uid = authRepository.currentUser?.uid;\n  if (uid != null &&\n      roomRepository.otherUidInDirectRoom(widget.roomId, uid) != null &&\n      _room.remoteParticipants.isEmpty) {\n    _leave();\n  }\n});"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Remote end push","start":169,"end":173,"code":"_remoteEndSub = NotificationService.instance.onCallEndedRemotely.listen((\n  roomId,\n) {\n  if (roomId == widget.roomId) _leave();\n});"}],"verify":"Hang up on either phone and both screens close. Cancel while the other phone is ringing and its ring stops."},{"id":"reconnect","title":"Show reconnects and poor network","platforms":["Flutter"],"summary":"Surface the SDK's reconnect attempts and connection quality instead of freezing silently.","why":"The SDK retries by itself when the network drops or switches (Wi-Fi to LTE). Without feedback, the call just looks frozen.","steps":["On \u003ccode>ReconnectingEvent\u003c/code> and \u003ccode>RoomAttemptReconnectEvent\u003c/code>, show an orange banner with attempt n/max.","On \u003ccode>RoomReconnectedEvent\u003c/code>, clear the banner. On \u003ccode>RoomDisconnectedEvent\u003c/code>, show an error with Try again.","Track the local \u003ccode>ConnectionQuality\u003c/code>. Poor or lost shows a \"Low network quality\" banner, and each tile gets a badge."],"snippets":[{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Events","start":124,"end":163,"code":"_listener.on\u003cwc.ReconnectingEvent>((_) {\n  if (!mounted || _left) return;\n  setState(() {\n    _reconnecting = true;\n    _reconnectAttempt = null;\n    _maxReconnectAttempts = null;\n  });\n});\n_listener.on\u003cwc.RoomAttemptReconnectEvent>((event) {\n  if (!mounted || _left) return;\n  setState(() {\n    _reconnecting = true;\n    _reconnectAttempt = event.attempt;\n    _maxReconnectAttempts = event.maxAttemptsRetry;\n  });\n});\n_listener.on\u003cwc.RoomReconnectedEvent>((_) {\n  if (!mounted || _left) return;\n  setState(() {\n    _reconnecting = false;\n    _reconnectAttempt = null;\n    _maxReconnectAttempts = null;\n    _localConnectionQuality = wc.ConnectionQuality.unknown;\n    _error = null;\n  });\n});\n_listener.on\u003cwc.RoomDisconnectedEvent>((_) {\n  if (!mounted || _left || _joinInProgress) return;\n  setState(() {\n    _connecting = false;\n    _reconnecting = false;\n    _reconnectAttempt = null;\n    _maxReconnectAttempts = null;\n    _error = 'The connection was lost. Check your network and try again.';\n  });\n});\n_listener.on\u003cwc.ParticipantConnectionQualityUpdatedEvent>((event) {\n  if (!mounted || event.participant != _room.localParticipant) return;\n  setState(() => _localConnectionQuality = event.connectionQuality);\n});"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Banner","start":738,"end":762,"code":"Widget? get _networkBanner {\n  if (_reconnecting) {\n    final attempt = _reconnectAttempt;\n    final maxAttempts = _maxReconnectAttempts;\n    final detail = attempt != null && maxAttempts != null\n        ? ' ($attempt/$maxAttempts)'\n        : '';\n    return _NetworkBanner(\n      icon: Icons.sync_rounded,\n      message: 'Connection lost. Reconnecting…$detail',\n      color: const Color(0xFFE65100),\n      showProgress: true,\n    );\n  }\n\n  if (_localConnectionQuality == wc.ConnectionQuality.poor ||\n      _localConnectionQuality == wc.ConnectionQuality.lost) {\n    return const _NetworkBanner(\n      icon: Icons.network_check_rounded,\n      message: 'Low network quality',\n      color: Color(0xFFF57C00),\n    );\n  }\n  return null;\n}"}],"verify":"Turn on airplane mode for 5 seconds mid-call. A \"Reconnecting… (1/10)\" banner appears and clears when you reconnect."},{"id":"calllog","title":"Keep a call history","platforms":["Flutter","Firebase"],"summary":"Each side writes its own entry to users/{uid}/callLogs: completed, no answer, missed, declined or failed.","why":"Each person logs from their own side, so the same call reads \"Declined\" for the callee and \"No answer\" for the caller. No server is needed.","steps":["Pick the status: answered means completed. Otherwise an error means failed, an outgoing call means no answer, and an incoming one means missed.","Write the log once from \u003ccode>_leave\u003c/code> or \u003ccode>dispose\u003c/code>, using the \u003ccode>_callLogged\u003c/code> guard.","Declined and timed-out rings never open \u003ccode>CallScreen\u003c/code>, so \u003ccode>NotificationService\u003c/code> logs those.","Stream the newest 200 entries, ordered by \u003ccode>startedAt\u003c/code>, into the Call log screen. Its call-back buttons use \u003ccode>startCall\u003c/code>."],"snippets":[{"file":"lib/features/CallLog/data/call_log_repository.dart","lang":"dart","label":"Repository","start":71,"end":98,"code":"Future\u003cvoid> logCall({\n  required String uid,\n  required String roomId,\n  required String otherUid,\n  required String otherLabel,\n  required bool video,\n  required bool outgoing,\n  required CallLogStatus status,\n  required DateTime startedAt,\n  required int durationSeconds,\n}) {\n  return _logsFor(uid).add({\n    'roomId': roomId,\n    'otherUid': otherUid,\n    'otherLabel': otherLabel,\n    'video': video,\n    'outgoing': outgoing,\n    'status': status.name,\n    'startedAt': Timestamp.fromDate(startedAt),\n    'durationSeconds': durationSeconds,\n  });\n}\n\nStream\u003cQuerySnapshot\u003cMap\u003cString, dynamic>>> watchCallLogs(String uid) {\n  return _logsFor(\n    uid,\n  ).orderBy('startedAt', descending: true).limit(200).snapshots();\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"_writeCallLog","start":499,"end":528,"code":"void _writeCallLog() {\n  if (_callLogged) return;\n  _callLogged = true;\n\n  final uid = authRepository.currentUser?.uid;\n  final otherUid = uid == null\n      ? null\n      : roomRepository.otherUidInDirectRoom(widget.roomId, uid);\n  if (uid == null || otherUid == null) return;\n\n  final status = _answered\n      ? CallLogStatus.completed\n      : _error != null\n      ? CallLogStatus.failed\n      : (widget.isOutgoing ? CallLogStatus.noAnswer : CallLogStatus.missed);\n\n  unawaited(\n    callLogRepository.logCall(\n      uid: uid,\n      roomId: widget.roomId,\n      otherUid: otherUid,\n      otherLabel: widget.title ?? otherUid,\n      video: widget.startWithVideo,\n      outgoing: widget.isOutgoing,\n      status: status,\n      startedAt: _startedAt,\n      durationSeconds: _elapsed.inSeconds,\n    ),\n  );\n}"}],"verify":"After a declined call, the caller's log shows \"No answer\" and the callee's shows \"Declined\"."},{"id":"rules","title":"Lock down Firestore","platforms":["Firebase"],"summary":"Signed-in users only. Each user owns their profile, call log and presence doc, and only a room's creator may change it.","why":"The client writes straight to Firestore, so these rules are the only thing stopping one user from editing another's data.","steps":["Deploy the rules to the named database \u003ccode>wibechatapp\u003c/code> (already configured in \u003ccode>firebase.json\u003c/code>).","Room creation requires \u003ccode>createdBy == request.auth.uid\u003c/code>, so nobody can create a room under someone else's name.","Run \u003ccode>firebase deploy --only firestore:rules\u003c/code>."],"snippets":[{"file":"firestore.rules","lang":"javascript","label":"firestore.rules","start":1,"end":32,"code":"rules_version = '2';\n\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{userId} {\n      allow read: if request.auth != null;\n      allow create, update: if request.auth != null && request.auth.uid == userId;\n      allow delete: if request.auth != null && request.auth.uid == userId;\n\n      // Each user's own call history — private, only they may read/write it.\n      match /callLogs/{logId} {\n        allow read, create, update, delete: if request.auth != null && request.auth.uid == userId;\n      }\n    }\n\n    // Rooms are open by default — any signed-in user may read the room list\n    // and join. Only the creator may rename/close their own room.\n    match /rooms/{roomId} {\n      allow read: if request.auth != null;\n      allow create: if request.auth != null\n        && request.resource.data.createdBy == request.auth.uid;\n      allow update, delete: if request.auth != null\n        && resource.data.createdBy == request.auth.uid;\n\n      // Presence: each participant manages only their own doc.\n      match /participants/{uid} {\n        allow read: if request.auth != null;\n        allow create, update, delete: if request.auth != null && request.auth.uid == uid;\n      }\n    }\n  }\n}"}],"verify":"In the Rules Playground, reading another user's \u003ccode>callLogs\u003c/code> is denied."}],"addons":[{"id":"pip","title":"Picture-in-Picture","status":"built","platformNote":"Android","platforms":["Android","Flutter"],"needs":["join","hangup"],"summary":"Press Home mid-call and the call shrinks into a floating window that shows the other person, with an End call button.","why":"Flutter can't create a system floating window on its own. \u003ccode>MainActivity\u003c/code> enters PiP natively on \u003ccode>onUserLeaveHint\u003c/code> and talks to Dart over a \u003ccode>talkz/pip\u003c/code> MethodChannel.","steps":["Add \u003ccode>android:supportsPictureInPicture=\"true\"\u003c/code> and \u003ccode>resizeableActivity=\"true\"\u003c/code> to the activity in the manifest.","In \u003ccode>MainActivity.kt\u003c/code>: handle \u003ccode>setCallActive\u003c/code>, and in \u003ccode>onUserLeaveHint\u003c/code> enter PiP (9:16) only while a call is active.","Add a \u003ccode>RemoteAction\u003c/code> \"End call\" that broadcasts to a receiver, which calls \u003ccode>pipHangUp\u003c/code> on the channel.","Report \u003ccode>onPictureInPictureModeChanged\u003c/code> to Dart as \u003ccode>pipModeChanged\u003c/code>.","In \u003ccode>CallScreen\u003c/code>: call \u003ccode>setCallActive(true)\u003c/code> in initState and \u003ccode>false\u003c/code> in dispose. While in PiP, render only the remote video, and call \u003ccode>_leave\u003c/code> on hang-up."],"snippets":[{"file":"android/app/src/main/AndroidManifest.xml","lang":"xml","label":"Manifest","start":23,"end":24,"code":"android:supportsPictureInPicture=\"true\"\nandroid:resizeableActivity=\"true\">"},{"file":"android/app/src/main/kotlin/com/zartek/talkz/MainActivity.kt","lang":"kotlin","label":"MainActivity.kt","start":22,"end":114,"code":"class MainActivity : FlutterActivity() {\n    private val channelName = \"talkz/pip\"\n    private var methodChannel: MethodChannel? = null\n    private var callActive = false\n    private var hangUpReceiver: BroadcastReceiver? = null\n\n    companion object {\n        private const val ACTION_HANG_UP = \"com.zartek.talkz.PIP_HANG_UP\"\n        private const val REQUEST_HANG_UP = 1001\n    }\n\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n        super.configureFlutterEngine(flutterEngine)\n        methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)\n        methodChannel?.setMethodCallHandler { call, result ->\n            when (call.method) {\n                // Flutter tells us whether a call is currently on screen, so\n                // onUserLeaveHint knows whether leaving the app should\n                // trigger PiP or just behave like a normal app switch.\n                \"setCallActive\" -> {\n                    callActive = call.arguments as? Boolean ?: false\n                    result.success(null)\n                }\n                \"enterPip\" -> {\n                    result.success(enterPip())\n                }\n                else -> result.notImplemented()\n            }\n        }\n    }\n\n    // Called when the user presses Home, switches apps, or opens Recents —\n    // not on things like the screen turning off, which is what we want:\n    // only a deliberate \"leave the app\" should shrink an active call.\n    override fun onUserLeaveHint() {\n        super.onUserLeaveHint()\n        if (callActive) enterPip()\n    }\n\n    private fun enterPip(): Boolean {\n        if (Build.VERSION.SDK_INT \u003c Build.VERSION_CODES.O) return false\n        val params = PictureInPictureParams.Builder()\n            .setAspectRatio(Rational(9, 16))\n            .setActions(listOf(hangUpAction()))\n            .build()\n        return try {\n            enterPictureInPictureMode(params)\n            true\n        } catch (_: Exception) {\n            // e.g. the device/manufacturer doesn't actually support it\n            // despite the API level — fall back to a normal minimize.\n            false\n        }\n    }\n\n    private fun hangUpAction(): RemoteAction {\n        val intent = Intent(ACTION_HANG_UP).setPackage(packageName)\n        val flags = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE\n        val pendingIntent = PendingIntent.getBroadcast(this, REQUEST_HANG_UP, intent, flags)\n        val icon = Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel)\n        return RemoteAction(icon, \"End call\", \"End call\", pendingIntent)\n    }\n\n    override fun onPictureInPictureModeChanged(\n        isInPictureInPictureMode: Boolean,\n        newConfig: Configuration\n    ) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)\n        methodChannel?.invokeMethod(\"pipModeChanged\", isInPictureInPictureMode)\n\n        if (isInPictureInPictureMode) {\n            if (hangUpReceiver == null) {\n                hangUpReceiver = object : BroadcastReceiver() {\n                    override fun onReceive(context: Context?, intent: Intent?) {\n                        methodChannel?.invokeMethod(\"pipHangUp\", null)\n                    }\n                }\n                val filter = IntentFilter(ACTION_HANG_UP)\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {\n                    registerReceiver(hangUpReceiver, filter, Context.RECEIVER_NOT_EXPORTED)\n                } else {\n                    @Suppress(\"UnspecifiedRegisterReceiverFlag\")\n                    registerReceiver(hangUpReceiver, filter)\n                }\n            }\n        } else {\n            hangUpReceiver?.let {\n                unregisterReceiver(it)\n                hangUpReceiver = null\n            }\n        }\n    }\n}"},{"file":"lib/common/functions/pip_controller.dart","lang":"dart","label":"PipController","start":10,"end":55,"code":"class PipController {\n  PipController._() {\n    if (_supported) {\n      _channel.setMethodCallHandler(_onMethodCall);\n    }\n  }\n\n  static final PipController instance = PipController._();\n\n  static const _channel = MethodChannel('talkz/pip');\n\n  bool get _supported => wc.lkPlatformIs(wc.PlatformType.android);\n\n  final _pipModeController = StreamController\u003cbool>.broadcast();\n  final _hangUpController = StreamController\u003cvoid>.broadcast();\n\n  /// Fires whenever the app enters/leaves Android's PiP window.\n  Stream\u003cbool> get onPipModeChanged => _pipModeController.stream;\n\n  /// Fires when the user
