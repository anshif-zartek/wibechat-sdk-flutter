 taps the \"End call\" action drawn on the PiP\n  /// window's own OS chrome (not something Flutter renders or can style).\n  Stream\u003cvoid> get onHangUpRequested => _hangUpController.stream;\n\n  Future\u003cvoid> _onMethodCall(MethodCall call) async {\n    switch (call.method) {\n      case 'pipModeChanged':\n        _pipModeController.add(call.arguments as bool? ?? false);\n      case 'pipHangUp':\n        _hangUpController.add(null);\n    }\n  }\n\n  /// Tells the native side whether a call is currently on screen, so it\n  /// knows whether the user leaving the app (Home button, app switch)\n  /// should shrink into PiP instead of just backgrounding normally.\n  Future\u003cvoid> setCallActive(bool active) async {\n    if (!_supported) return;\n    try {\n      await _channel.invokeMethod('setCallActive', active);\n    } catch (_) {\n      // Best-effort — PiP is a nice-to-have, never worth crashing the call.\n    }\n  }\n}\n\nfinal pipController = PipController.instance;"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"CallScreen hooks","start":175,"end":179,"code":"unawaited(pipController.setCallActive(true));\n_pipModeSub = pipController.onPipModeChanged.listen((inPip) {\n  if (mounted) setState(() => _inPipMode = inPip);\n});\n_pipHangUpSub = pipController.onHangUpRequested.listen((_) => _leave());"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"PiP render","start":607,"end":609,"code":"if (_inPipMode) {\n  return Material(color: Colors.black, child: _buildPipVideo());\n}"}],"verify":"On Android 8+, press Home mid-call. A floating window shows the other person, and its End call button hangs up."},{"id":"screenshare","title":"Screen sharing","status":"built","platformNote":"Android","platforms":["Android","Flutter"],"needs":["join","controls"],"summary":"Share your screen and system audio into the call. Receivers see it uncropped with a screen-share badge.","why":"Android won't start MediaProjection capture unless a foreground service is running. \u003ccode>flutter_background\u003c/code> provides that service and its required ongoing notification.","steps":["Add the \u003ccode>FOREGROUND_SERVICE_MEDIA_PROJECTION\u003c/code> permission and declare \u003ccode>IsolateHolderService\u003c/code> with \u003ccode>foregroundServiceType=\"mediaProjection\"\u003c/code>.","Before sharing, call \u003ccode>Hardware.requestCapturePermission()\u003c/code>, then start background execution.","Call \u003ccode>setScreenShareEnabled(true, captureScreenAudio: true)\u003c/code>. If it fails, turn background execution off again.","Stop the service when sharing stops, in \u003ccode>_leave\u003c/code>, and in \u003ccode>dispose\u003c/code>.","Tiles prefer the \u003ccode>screenShareVideo\u003c/code> track and render it with \u003ccode>contain\u003c/code>."],"snippets":[{"file":"android/app/src/main/AndroidManifest.xml","lang":"xml","label":"Manifest service","start":43,"end":50,"code":"\u003c!-- Required so MediaProjection (screen share) can keep running while\n     the call screen is open — Android refuses to start screen capture\n     from an app that isn't backed by a foreground service. -->\n\u003cservice\n    android:name=\"de.julianassmann.flutter_background.IsolateHolderService\"\n    android:enabled=\"true\"\n    android:exported=\"false\"\n    android:foregroundServiceType=\"mediaProjection\" />"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"_toggleScreenShare","start":279,"end":334,"code":"Future\u003cvoid> _toggleScreenShare() async {\n  if (_screenShareEnabled) {\n    await _room.localParticipant?.setScreenShareEnabled(false);\n    if (wc.lkPlatformIs(wc.PlatformType.android)) {\n      unawaited(FlutterBackground.disableBackgroundExecution());\n    }\n    if (mounted) setState(() => _screenShareEnabled = false);\n    return;\n  }\n\n  if (wc.lkPlatformIsWebMobile()) {\n    if (mounted) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(\n          content: Text('Screen share is not supported on mobile web'),\n        ),\n      );\n    }\n    return;\n  }\n\n  // No-op (returns true) on platforms that don't need it — safe to call\n  // unconditionally.\n  final hasCapturePermission = await wc.Hardware.instance\n      .requestCapturePermission();\n  if (!hasCapturePermission) return;\n\n  if (wc.lkPlatformIs(wc.PlatformType.android) &&\n      !await _ensureAndroidScreenShareBackground()) {\n    if (mounted) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(\n          content: Text('Screen share needs the background-run permission'),\n        ),\n      );\n    }\n    return;\n  }\n\n  try {\n    await _room.localParticipant?.setScreenShareEnabled(\n      true,\n      captureScreenAudio: true,\n    );\n    if (mounted) setState(() => _screenShareEnabled = true);\n  } catch (e) {\n    if (wc.lkPlatformIs(wc.PlatformType.android)) {\n      unawaited(FlutterBackground.disableBackgroundExecution());\n    }\n    if (mounted) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text('Could not start screen share: $e')),\n      );\n    }\n  }\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Foreground service","start":339,"end":358,"code":"Future\u003cbool> _ensureAndroidScreenShareBackground() async {\n  try {\n    if (FlutterBackground.isBackgroundExecutionEnabled) return true;\n    final initialized = await FlutterBackground.initialize(\n      androidConfig: const FlutterBackgroundAndroidConfig(\n        notificationTitle: 'Screen sharing',\n        notificationText: 'Wibechat is sharing your screen.',\n        notificationImportance: AndroidNotificationImportance.normal,\n        notificationIcon: AndroidResource(\n          name: 'ic_launcher',\n          defType: 'mipmap',\n        ),\n      ),\n    );\n    if (!initialized) return false;\n    return FlutterBackground.enableBackgroundExecution();\n  } catch (_) {\n    return false;\n  }\n}"}],"verify":"Tap Share on Android. A \"Screen sharing\" notification appears and the other device shows your screen."},{"id":"add-to-call","title":"Add someone to a call","status":"built","platformNote":"All platforms","platforms":["Flutter"],"needs":["place-call","incoming"],"summary":"Turn a 1:1 call into a group call by ringing a third person into the same room.","why":"This uses the same push payload as a new call, but points at the existing \u003ccode>roomId\u003c/code>. When the third person accepts, the layout switches to the grid automatically.","steps":["Show the Add to call action in the app bar only for connected direct rooms.","Open a bottom sheet of users, excluding everyone already in the room (\u003ccode>remoteParticipants\u003c/code> identities).","Send a \u003ccode>call\u003c/code>/\u003ccode>video_call\u003c/code> push with the current \u003ccode>roomId\u003c/code>. Don't navigate anywhere."],"snippets":[{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"_inviteToCall","start":371,"end":398,"code":"Future\u003cvoid> _inviteToCall(String otherUid, String label) async {\n  final currentUser = authRepository.currentUser;\n  if (currentUser == null) return;\n\n  final callerLabel = currentUser.displayName?.trim().isNotEmpty == true\n      ? currentUser.displayName!\n      : (currentUser.email ?? 'Someone');\n\n  await pushNotificationApi.send(\n    userId: otherUid,\n    title: widget.startWithVideo ? 'Incoming video call' : 'Incoming call',\n    desc: '$callerLabel is adding you to a call',\n    data: {\n      'type': widget.startWithVideo\n          ? NotificationType.videoCall\n          : NotificationType.call,\n      'roomId': widget.roomId,\n      'title': callerLabel,\n      'callerId': currentUser.uid,\n    },\n  );\n\n  if (mounted) {\n    ScaffoldMessenger.of(\n      context,\n    ).showSnackBar(SnackBar(content: Text('Invited $label to the call')));\n  }\n}"},{"file":"lib/features/Room/presentation/call_screen.dart","lang":"dart","label":"Exclude in-call","start":405,"end":408,"code":"final inCallUids = \u003cString>{\n  currentUid,\n  ..._room.remoteParticipants.values.map((p) => p.identity),\n};"}],"verify":"During a 1:1 call, add a third user. Their phone rings, and when they accept, everyone sees a 3-tile grid."},{"id":"presence","title":"Open rooms and live presence","status":"built","platformNote":"All platforms","platforms":["Flutter","Firebase"],"needs":["join"],"summary":"Named rooms anyone can join, showing who is inside right now.","why":"Presence is best-effort. It is written on connect and deleted on leave, so a crashed app can leave a stale entry. Server-side Wibechat webhooks would make it authoritative.","steps":["\u003ccode>createRoom\u003c/code> writes \u003ccode>rooms/{name}\u003c/code> with \u003ccode>open: true\u003c/code>. \u003ccode>watchRooms\u003c/code> streams them, newest first.","After connecting, \u003ccode>joinPresence\u003c/code> writes \u003ccode>rooms/{id}/participants/{uid}\u003c/code>. \u003ccode>_leave\u003c/code> deletes it.","Each room card shows \u003ccode>watchParticipants\u003c/code> and falls back to \"Be the first to join\"."],"snippets":[{"file":"lib/features/Room/data/room_repository.dart","lang":"dart","label":"Rooms","start":23,"end":35,"code":"Stream\u003cQuerySnapshot\u003cMap\u003cString, dynamic>>> watchRooms() {\n  return _rooms.orderBy('createdAt', descending: true).snapshots();\n}\n\nFuture\u003cvoid> createRoom({required String name, required User creator}) {\n  return _rooms.doc(name).set({\n    'name': name,\n    'open': true,\n    'createdBy': creator.uid,\n    'createdByEmail': creator.email,\n    'createdAt': FieldValue.serverTimestamp(),\n  });\n}"},{"file":"lib/features/Room/data/room_repository.dart","lang":"dart","label":"Presence","start":49,"end":61,"code":"Future\u003cvoid> joinPresence({required String roomId, required User user}) {\n  return _rooms.doc(roomId).collection('participants').doc(user.uid).set({\n    'uid': user.uid,\n    'email': user.email,\n    'displayName': user.displayName,\n    'photoUrl': user.photoURL,\n    'joinedAt': FieldValue.serverTimestamp(),\n  });\n}\n\nFuture\u003cvoid> leavePresence({required String roomId, required String uid}) {\n  return _rooms.doc(roomId).collection('participants').doc(uid).delete();\n}"}],"verify":"Join a room on one phone, and the Rooms tab on the other phone lists you inside it."},{"id":"google","title":"Google Sign-In","status":"built","platformNote":"Needs console setup","platforms":["Flutter","Firebase"],"needs":["auth"],"summary":"One-tap sign-in that merges the Google profile and photo into users/{uid}.","why":"The Dart code is complete, but each environment needs its own console setup before Google sign-in works.","steps":["Enable Google as a provider in Firebase Auth.","Android: register the debug \u003cb>and\u003c/b> release SHA-1/SHA-256 fingerprints, then download \u003ccode>google-services.json\u003c/code> again.","iOS: add \u003ccode>REVERSED_CLIENT_ID\u003c/code> from \u003ccode>GoogleService-Info.plist\u003c/code> as a URL scheme.","A \u003ccode>null\u003c/code> result means the user closed the picker. Don't show an error for it."],"snippets":[{"file":"lib/features/Auth/data/auth_repository.dart","lang":"dart","label":"signInWithGoogle","start":79,"end":106,"code":"Future\u003cUser?> signInWithGoogle() async {\n  final googleUser = await _googleSignIn.signIn();\n  if (googleUser == null) return null;\n\n  final googleAuth = await googleUser.authentication;\n  final credential = GoogleAuthProvider.credential(\n    accessToken: googleAuth.accessToken,\n    idToken: googleAuth.idToken,\n  );\n  final userCredential = await _auth.signInWithCredential(credential);\n  final user = userCredential.user!;\n\n  final userDoc = _firestore\n      .collection(FirestoreConstants.usersCollection)\n      .doc(user.uid);\n  final existing = await userDoc.get();\n  await userDoc.set({\n    'uid': user.uid,\n    'email': user.email,\n    'displayName': user.displayName ?? '',\n    // Google's account photo — shown wherever the app renders an avatar.\n    'photoUrl': user.photoURL,\n    if (!existing.exists) 'createdAt': FieldValue.serverTimestamp(),\n  }, SetOptions(merge: true));\n\n  await _registerFcmToken(user.uid);\n  return user;\n}"}],"verify":"Signing in with Google on a release build fills \u003ccode>photoUrl\u003c/code> on the user doc."},{"id":"ios-screenshare","title":"iOS screen sharing","status":"planned","platformNote":"iOS","platforms":["iOS"],"needs":["screenshare"],"summary":"Not built yet. iOS needs a ReplayKit Broadcast Upload Extension.","why":"iOS doesn't let an app capture the whole screen directly. A separate extension target captures it and passes frames to the app through a shared App Group.","steps":["In Xcode, choose File → New → Target → \u003cb>Broadcast Upload Extension\u003c/b>.","Create an App Group and add it to both the Runner and the extension.","Implement the extension's \u003ccode>SampleHandler\u003c/code> following the iOS ReplayKit broadcast-extension setup for screen sharing, and set the app group and extension bundle id in Runner's Info.plist.","Drop the platform restriction in \u003ccode>_toggleScreenShare\u003c/code> only after the extension works on a real device."],"snippets":[],"verify":"Tap Share on an iPhone. The system broadcast picker appears and the other device shows the iPhone screen."},{"id":"ios-pip","title":"iOS Picture-in-Picture","status":"planned","platformNote":"iOS","platforms":["iOS"],"needs":["pip"],"summary":"Not built yet. iOS PiP needs a native AVPictureInPictureController fed by live video frames.","why":"Android's approach resizes the whole activity, so the existing Flutter video widget is reused. iOS can't do that. WebRTC frames have to be bridged into an \u003ccode>AVSampleBufferDisplayLayer\u003c/code>.","steps":["Enable the \u003cb>Audio, AirPlay and Picture in Picture\u003c/b> background mode.","Create an \u003ccode>AVPictureInPictureController\u003c/code> with a \u003ccode>ContentSource\u003c/code> backed by an \u003ccode>AVSampleBufferDisplayLayer\u003c/code>.","Feed the remote \u003ccode>RTCVideoTrack\u003c/code> frames into that layer as \u003ccode>CMSampleBuffer\u003c/code>s.","Make \u003ccode>PipController\u003c/code> support iOS (it currently returns early everywhere except Android)."],"snippets":[],"verify":"Swipe home on an iPhone mid-call. A floating window keeps showing the other person."}]};
const ALL = [...DATA.core, ...DATA.addons];
DATA.core.forEach((s, i) => (s.n = i + 1));
const byId = Object.fromEntries(ALL.map((s) => [s.id, s]));
const KEY = 'wibechat-flutter-calling-v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const st = Object.assign({ cur: DATA.core[0].id, checks: {} }, load());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const checked = (s) => st.checks[s.id] || [];
const ratio = (s) => checked(s).length / s.steps.length;
const isDone = (s) => checked(s).length === s.steps.length;

function ring(s) {
  const C = 2 * Math.PI * 7, off = C * (1 - ratio(s));
  return '<svg class="ring" viewBox="0 0 16 16" aria-hidden="true"><circle class="bgc" cx="8" cy="8" r="7"/><circle class="fgc" cx="8" cy="8" r="7" stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '"/><path d="M4.8 8.3l2.2 2.2 4.3-4.5"/></svg>';
}
function sideItem(s) {
  return '<li><button class="item' + (isDone(s) ? ' done' : '') + '" data-go="' + s.id + '" aria-current="' + (s.id === st.cur) + '">' + ring(s) +
    '<span>' + esc(s.title) + (s.status === 'planned' ? '<span class="soon">planned</span>' : '') + '</span></button></li>';
}
function renderSide() {
  document.getElementById('list-core').innerHTML = DATA.core.map(sideItem).join('');
  document.getElementById('list-addons').innerHTML = DATA.addons.map(sideItem).join('');
  const done = ALL.filter(isDone).length;
  document.getElementById('pct').textContent = done + ' of ' + ALL.length + ' steps complete';
  document.getElementById('pct-m').textContent = done + '/' + ALL.length;
  document.getElementById('bar').style.width = (done / ALL.length) * 100 + '%';
  const opt = (s) => '<option value="' + s.id + '"' + (s.id === st.cur ? ' selected' : '') + '>' + (isDone(s) ? '✓ ' : '') + (s.n ? s.n + '. ' : '') + esc(s.title) + '</option>';
  document.getElementById('pick').innerHTML = '<optgroup label="Core flow">' + DATA.core.map(opt).join('') + '</optgroup><optgroup label="Add-ons">' + DATA.addons.map(opt).join('') + '</optgroup>';
}

function hl(sn) {
  if (window.hljs && hljs.getLanguage(sn.lang)) { try { return hljs.highlight(sn.code, { language: sn.lang, ignoreIllegals: true }).value; } catch {} }
  return esc(sn.code);
}
function codeView(s, i) {
  const sn = s.snippets[i], n = sn.code.split('\n').length;
  const base = sn.file ? sn.start : 1;
  return (sn.file ? '<div class="path">' + esc(sn.file) + ':' + sn.start + '–' + sn.end + '</div>' : '') +
    '<div class="scroll" tabindex="0"><div class="lines"><div class="gut" aria-hidden="true">' +
    Array.from({ length: n }, (_, k) => base + k).join('\n') + '</div><pre><code>' + hl(sn) + '</code></pre></div></div>';
}

function render(animate) {
  const s = byId[st.cur], isAdd = !s.n;
  const idx = ALL.indexOf(s), prev = ALL[idx - 1], next = ALL[idx + 1];
  const where = isAdd ? 'Add-on · ' + esc(s.platformNote) : 'Step ' + s.n + ' of ' + DATA.core.length;
  const status = isDone(s) ? '<span class="st-done">· Complete</span>' : s.status === 'planned' ? '<span class="st-plan">· Not built yet</span>' : '';
  const v = document.getElementById('view');
  v.innerHTML =
    '<div class="eyebrow"><span>' + where + '</span>' + status + '</div>' +
    '<h1>' + esc(s.title) + '</h1>' +
    '<p class="why">' + s.why + '</p>' +
    (s.needs ? '<div class="needs">Requires ' + s.needs.map((id) => '<button data-go="' + id + '">' + esc(byId[id].title) + '</button>').join(', ') + '</div>' : '') +
    '<h3>Checklist</h3><ul class="checks">' + s.steps.map((t, i) =>
      '<li><label><input type="checkbox" id="c-' + s.id + '-' + i + '" data-i="' + i + '"' + (checked(s).includes(i) ? ' checked' : '') + '><span>' + t + '</span></label></li>').join('') + '</ul>' +
    '<h3>Code</h3>' + (s.snippets.length
      ? '<div class="code"><div class="cbar" role="tablist">' + s.snippets.map((sn, i) =>
          '<button class="ctab" role="tab" data-tab="' + i + '" aria-selected="' + (i === 0) + '">' + esc(sn.label || sn.file.split('/').pop()) + '</button>').join('') +
          '<span class="sp"></span><button class="copy" id="copy">Copy</button></div><div id="cbody">' + codeView(s, 0) + '</div></div>'
      : '<p class="nocode">There is no code for this yet. The checklist describes what it would take.</p>') +
    '<h3>Test</h3><p class="test">' + s.verify + '</p>' +
    '<div class="foot">' +
      (prev ? '<button class="nav" data-go="' + prev.id + '"><small>← Previous</small><span>' + esc(prev.title) + '</span></button>' : '<span></span>') +
      '<button class="complete' + (isDone(s) ? ' is-done' : '') + '" id="complete">' + (isDone(s) ? '✓ Completed' : 'Mark complete') + '</button>' +
      (next ? '<button class="nav next" data-go="' + next.id + '"><small>Next →</small><span>' + esc(next.title) + '</span></button>' : '<span></span>') +
    '</div><div class="keys"><kbd>←</kbd> <kbd>→</kbd> move between steps · <kbd>C</kbd> mark complete</div>';
  if (animate) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  renderSide();
}

function go(id) {
  if (!byId[id] || id === st.cur) return;
  st.cur = id; save(); render(true);
  history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
  document.querySelector('.item[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
}
function setChecks(s, list) {
  st.checks[s.id] = list; save();
  const wasDone = document.getElementById('complete').classList.contains('is-done');
  if (wasDone !== isDone(s)) { const y = scrollY; render(false); scrollTo(0, y); } else renderSide();
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const s = byId[st.cur];
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.tab) {
    document.querySelectorAll('.ctab').forEach((b) => b.setAttribute('aria-selected', String(b === t)));
    document.getElementById('cbody').innerHTML = codeView(s, +t.dataset.tab);
  } else if (t.id === 'copy') {
    const i = +document.querySelector('.ctab[aria-selected="true"]').dataset.tab;
    try { await navigator.clipboard.writeText(s.snippets[i].code); t.textContent = 'Copied'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.querySelector('#cbody pre')); getSelection().removeAllRanges(); getSelection().addRange(r); t.textContent = 'Press ⌘C'; }
    setTimeout(() => (t.textContent = 'Copy'), 1500);
  } else if (t.id === 'complete') {
    setChecks(s, isDone(s) ? [] : s.steps.map((_, i) => i));
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'pick') return go(e.target.value);
  if (e.target.dataset.i === undefined) return;
  const s = byId[st.cur];
  const list = [...document.querySelectorAll('.checks input')].filter((x) => x.checked).map((x) => +x.dataset.i);
  setChecks(s, list);
});
document.addEventListener('keydown', (e) => {
  const a = document.activeElement;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (a.tagName === 'SELECT' || a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox')) return;
  const i = ALL.findIndex((s) => s.id === st.cur);
  if (e.key === 'ArrowRight' && ALL[i + 1]) go(ALL[i + 1].id);
  else if (e.key === 'ArrowLeft' && ALL[i - 1]) go(ALL[i - 1].id);
  else if (e.key.toLowerCase() === 'c') document.getElementById('complete').click();
});

const h = location.hash.slice(1);
if (byId[h]) st.cur = h;
if (!byId[st.cur]) st.cur = DATA.core[0].id;
render(false);
</script>
</body>
</html>
